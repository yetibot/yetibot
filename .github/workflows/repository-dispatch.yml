name: Handle repository dispatch events

# this allows other repos to send a release dispatch here which then triggers a
# version bump
on:
  repository_dispatch:
    types: [bump]

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.YETIBOT_GITHUB_TOKEN }}

      - uses: DeLaGuardo/setup-clojure@13
        with:
          lein: 2.11.2

      - name: maven cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('project.clj') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Bump!
        env:
          YB_VERSION: ${{ github.event.client_payload.message.yb_version }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          python3 .github/ci/bump_core_fixture.py
          lein update-dependency yetibot/core "$YB_VERSION"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.YETIBOT_GITHUB_TOKEN }}
          commit-message: Bump yetibot/core to "${{ github.event.client_payload.message.yb_version }}"
          title: Bump yetibot/core to "${{ github.event.client_payload.message.yb_version }}"
          branch: yetibot/core-${{ github.event.client_payload.message.yb_version }}
          add-paths: |
            project.clj
            test/yetibot/test/integration/ai_status.clj
