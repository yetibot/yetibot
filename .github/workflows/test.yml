name: Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    env:
      JAVA_TOOL_OPTIONS: -Xmx1024m
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: yetibot
          POSTGRES_PASSWORD: yetibot
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5432:5432
    steps:
      # PR validation is reusable only because we test this exact source tree.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: CI gate regression tests
        run: python3 -m unittest discover -s .github/ci -v
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: DeLaGuardo/setup-clojure@13
        with:
          lein: 2.11.2
      - name: Maven cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('project.clj') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Midje
        timeout-minutes: 6
        env:
          YETIBOT_DB_URL: postgresql://yetibot:yetibot@localhost:5432/yetibot
        run: |
          timeout --signal=QUIT --kill-after=20s 240s \
            lein with-profile +test midje :all
      - name: Catalog cache tests
        timeout-minutes: 6
        env:
          YETIBOT_DB_URL: postgresql://yetibot:yetibot@localhost:5432/yetibot
        run: |
          timeout --signal=QUIT --kill-after=20s 240s \
            lein with-profile +test test \
              yetibot.test.models.ai-mcp-catalog \
              yetibot.test.models.ai-provider-catalog
