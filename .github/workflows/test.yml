name: Test

on:
  push:
    branches:
      - "*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: yetibot
          POSTGRES_PASSWORD: yetibot
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: checkout
        uses: actions/checkout@v6

      # Clojail's sandbox requires the SecurityManager supported by Java 17.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: DeLaGuardo/setup-clojure@13
        with:
          lein: 2.11.2

      - name: maven cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('project.clj') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Dump JVM stacks on a stall, then fail rather than occupy a runner
      # indefinitely. Both suites remain mandatory in the required test job.
      - name: Midje coverage
        timeout-minutes: 6
        env:
          YETIBOT_DB_URL: postgresql://yetibot:yetibot@localhost:5432/yetibot
          CLOVERAGE_VERSION: 1.1.2
        run: |
          timeout --signal=QUIT --kill-after=20s 240s \
            lein with-profile +test cloverage --codecov --runner midje

      - name: Catalog cache tests
        timeout-minutes: 6
        env:
          YETIBOT_DB_URL: postgresql://yetibot:yetibot@localhost:5432/yetibot
        run: |
          timeout --signal=QUIT --kill-after=20s 240s \
            lein with-profile +test test \
              yetibot.test.models.ai-mcp-catalog \
              yetibot.test.models.ai-provider-catalog

      # - uses: codecov/codecov-action@v5
      #   with:
      #     fail_ci_if_error: true # optional (default = false)
      #     verbose: false # optional (default = false)
